# .github/workflows/aws_deploy.yml
name: Deploy to Lambda

on:
  push:
    branches: [features/aws]
    
jobs:
  deploy-layer:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Zip constraints layer
        run: |
          mkdir -p layer/Constraints
          cp Shared/Constraints/*.json layer/Constraints/
          cd layer && zip -r ../layer.zip .
      - name: Publish layer version
        run: |
          aws lambda publish-layer-version \
            --layer-name noise-constraints \
            --zip-file fileb://layer.zip \
            --region us-east-2
      - name: Attach layer to function
        run: |
          LAYER_ARN=$(aws lambda list-layer-versions \
            --layer-name noise-constraints \
            --query 'LayerVersions[0].LayerVersionArn' \
            --output text \
            --region us-east-2)
          aws lambda update-function-configuration \
            --function-name noise-generator \
            --layers $LAYER_ARN \
            --region us-east-2
      - name: Clean up old layer versions
        run: |
          aws lambda list-layer-versions \
            --layer-name noise-constraints \
            --region us-east-2 \
            --query 'LayerVersions[1:].Version' \
            --output text | tr '\t' '\n' | while read version; do
              aws lambda delete-layer-version \
                --layer-name noise-constraints \
                --version-number $version \
                --region us-east-2
            done

  deploy-function:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install numpy pillow -t Server/
      - name: Zip deployment package
        run: |
          cd Server
          zip -r ../deployment.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "venv/*" \
            --exclude "app.py"
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name noise-generator \
            --zip-file fileb://deployment.zip \
            --region us-east-2